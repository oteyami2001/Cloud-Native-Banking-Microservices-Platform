name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python services (lint, unit, contract, invariant, concurrency)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - name: Tests (no AWS credentials; moto-backed)
        run: python -m pytest -q --cov --cov-report=xml --cov-report=term --cov-fail-under=85 --junitxml=reports/junit.xml
      - name: Validation scenario report
        run: python scripts/scenario_report.py reports/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-reports
          path: |
            reports/
            coverage.xml
          retention-days: 30

  terraform:
    name: Terraform fmt, validate and test (mocked providers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      - name: Validate root modules
        run: |
          for d in terraform/bootstrap terraform/envs/dev terraform/envs/staging terraform/envs/prod; do
            terraform -chdir="$d" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$d" validate
          done
      - name: terraform test
        run: |
          for d in terraform/modules/*/; do
            if [ -d "$d/tests" ]; then
              terraform -chdir="$d" init -backend=false -input=false
              terraform -chdir="$d" test
            fi
          done

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
