name: deploy-frontend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: vars.AWS_ACCOUNT_ID != '' && vars.FRONTEND_BUCKET != ''
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build (public configuration only; no secrets in the SPA)
        working-directory: frontend
        env:
          VITE_AUTH_MODE: cognito # never ship the offline persona mode
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          VITE_REDIRECT_URI: ${{ vars.SITE_URL }}/callback
        run: npm ci && npm test && npm run build
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/novabank-github-deploy
          role-session-name: frontend-${{ github.run_id }}
      - run: |
          aws s3 sync frontend/dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete --cache-control "public,max-age=300"
          aws s3 cp frontend/dist/index.html "s3://${{ vars.FRONTEND_BUCKET }}/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ vars.FRONTEND_DISTRIBUTION_ID }}" --paths "/index.html"
