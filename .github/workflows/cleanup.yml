name: cleanup

# Destroys project-owned dev resources only. Requires typing the confirmation
# phrase AND approval on the protected "cleanup" environment. Bootstrap
# (state bucket, OIDC roles) is never destroyed by this workflow.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy-novabank-dev" to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  destroy:
    if: vars.AWS_ACCOUNT_ID != '' && inputs.confirm == 'destroy-novabank-dev'
    runs-on: ubuntu-24.04
    environment: cleanup
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/novabank-github-cleanup
          role-session-name: cleanup-${{ github.run_id }}
      - run: |
          terraform -chdir=terraform/envs/dev init -input=false -lockfile=readonly \
            -backend-config="bucket=novabank-tfstate-${{ vars.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - run: |
          terraform -chdir=terraform/envs/dev destroy -auto-approve -input=false -lock-timeout=5m \
            -var="expected_account_id=${{ vars.AWS_ACCOUNT_ID }}" -var="region=${{ vars.AWS_REGION }}" \
            -var='evidence_force_destroy=true'
      - name: Verify cleanup (T30)
        run: bash scripts/verify_cleanup.sh novabank-dev >> "$GITHUB_STEP_SUMMARY"
