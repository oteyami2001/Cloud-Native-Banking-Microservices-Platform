name: drift-detection

on:
  schedule:
    - cron: "11 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    if: vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-24.04
    environment: plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/novabank-github-plan
          role-session-name: drift-${{ github.run_id }}
      - run: |
          terraform -chdir=terraform/envs/dev init -input=false -lockfile=readonly \
            -backend-config="bucket=novabank-tfstate-${{ vars.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Detect drift (exit code 2 = drift)
        run: |
          set +e
          terraform -chdir=terraform/envs/dev plan -input=false -lock=false -detailed-exitcode -no-color \
            -var="expected_account_id=${{ vars.AWS_ACCOUNT_ID }}" -var="region=${{ vars.AWS_REGION }}" \
            -var='evidence_force_destroy=true' > drift.txt
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            { echo "## Infrastructure drift detected"; echo '```'; grep -E '^\s+[~+-]|# ' drift.txt | head -100; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Infrastructure drift detected in dev"
            exit 1
          fi
          test "$code" = "0"
          echo "No drift detected." >> "$GITHUB_STEP_SUMMARY"
