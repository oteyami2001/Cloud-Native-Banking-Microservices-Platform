name: deploy-services

# Deploys a verified build to Lambda: publish immutable versions, shift the
# "live" alias, smoke-test, and roll back to the previous version on failure.
# Terraform never changes code or aliases (ADR-0010).

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID of build-services to deploy
        required: true
        type: string
      services:
        description: Comma-separated services, or "all"
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      contents: read
      id-token: write
      actions: read
      attestations: read
    steps:
      - name: Validate inputs
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          SERVICES: ${{ inputs.services }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::build_run_id must be numeric"; exit 1; }
          [[ "$SERVICES" =~ ^[a-z,-]+$ ]] || { echo "::error::invalid services list"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lambda-packages
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Verify artifact provenance and checksums (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify_artifacts.py dist/manifest.json
          for f in dist/*.zip; do gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"; done
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/novabank-github-deploy
          role-session-name: deploy-${{ github.run_id }}
      - name: Deploy with automatic rollback
        env:
          SERVICES: ${{ inputs.services }}
          ARTIFACT_BUCKET: novabank-artifacts-${{ vars.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}
          NAME_PREFIX: novabank-dev
        run: python3 scripts/deploy_lambda.py --manifest dist/manifest.json --services "$SERVICES" >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    needs: deploy
    uses: ./.github/workflows/integration-tests.yml
    permissions:
      contents: read
